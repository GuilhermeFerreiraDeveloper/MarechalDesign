<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url('png/fundo-contato.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-y: auto;
        }

        h1 {
            color: #c6a88b;
            font-size: 48px;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            display: none; /* Ocultando o h1 */
        }

        .header {
            width: 100%;
            position: relative;
            padding-top: 20px;
        }

        .logo {
            max-width: 300px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: block;
            margin: 0 auto;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-link {
            display: block;
            text-decoration: none;
        }

        .contato-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            left: calc(50% - 660px);
            top: 16px;
        }

        .contato-btn:hover {
            transform: scale(1.05);
        }

        .sites-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            left: calc(50% - 660px);
            top: 203px;
        }

        .sites-btn:hover {
            transform: scale(1.05);
        }

        .conheca-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            right: calc(50% - 660px);
            top: 16px;
        }

        .conheca-btn:hover {
            transform: scale(1.05);
        }

        .designer-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            right: calc(50% - 660px);
            top: 203px;
        }

        .designer-btn:hover {
            transform: scale(1.05);
        }

        @media screen and (max-width: 768px) {
            body {
                background-image: url('png/botao-contatocelular.png');
                background-attachment: fixed;
                background-size: cover;
                min-height: 100vh;
                overflow-y: auto;
            }

            .header {
                padding-top: 10px;
                position: relative;
            }

            .logo {
                max-width: 68px;
                margin-top: 27px;
            }

            .contato-btn {
                max-width: 100px;
                position: absolute;
                left: calc(50% - 150px);
                top: 32px;
            }

            .sites-btn {
                max-width: 100px;
                position: absolute;
                left: calc(50% - 150px);
                top: 80px;
            }

            .conheca-btn {
                max-width: 100px;
                position: absolute;
                right: calc(50% - 150px);
                top: 32px;

            .designer-btn {
                max-width: 100px;
                position: absolute;

                top: 80px;
            }

            .contato-btn:hover,
            .sites-btn:hover,
            .conheca-btn:hover,
            .designer-btn:hover {
                transform: scale(1.02);
            }
        }

        .papiro-mobile {
            display: none;
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 0 auto;
            padding: 10px 0;
            min-height: calc(100vh - 200px);
        }

        .papiro-desktop {
            display: block;
            width: 100%;
            max-width: 1920px;
            height: auto;
            margin: 0 auto;
            padding: 20px 0;
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 200px);
        }

        .instagram-btn-desktop {
            position: absolute;
            left: 40%;
            transform: translateX(-50%);
            top: 125%;
            z-index: 3;
            cursor: pointer;

            max-width: 890px;
            width: 100%;
            height: auto;
            display: block;

            width: 100%;

            top: 60%;
            z-index: 3;

            transition: transform 0.2s ease;
            max-width: 200px;
            width: 100%;
            height: auto;
            display: none;

        .linkedin-btn-mobile {
            position: absolute;
            left: 38%;
            transform: translateX(-50%);
            top: 65%;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.2s ease;
            max-width: 200px;
            width: 100%;
            height: auto;
            display: none;
        }


        .instagram-btn-mobile {
            position: absolute;

            top: 55%;
            z-index: 3;
            cursor: pointer;
            transition: transform 0.2s ease;
            max-width: 200px;
            width: 100%;
            height: auto;
            display: none;
        }

        .instagram-btn-desktop:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .instagram-btn-mobile:hover {
            transform: translateX(-50%) scale(1.05);
        }

        .whatsapp-btn-desktop:hover {

        .whatsapp-btn-mobile:hover {

        .linkedin-btn-desktop:hover {

        .linkedin-btn-mobile:hover {

        }

            .papiro-mobile {
                display: block;
                position: relative;

            .papiro-desktop {

            .whatsapp-btn-mobile {

            .linkedin-btn-desktop {

            .instagram-btn-desktop {
