<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: url('png/fundo-contato.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            overflow-y: auto;
        }

        h1 {
            color: #c6a88b;
            font-size: 48px;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            display: none; /* Ocultando o h1 */
        }

        .header {
            width: 100%;
            position: relative;
            padding-top: 20px;
        }

        .logo {
            max-width: 300px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            display: block;
            margin: 0 auto;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-link {
            display: block;
            text-decoration: none;
        }

        .contato-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            left: calc(50% - 660px);
            top: 16px;
        }

        .contato-btn:hover {
            transform: scale(1.05);
        }

        .sites-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            left: calc(50% - 660px);
            top: 203px;
        }

        .sites-btn:hover {
            transform: scale(1.05);
        }

        .conheca-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            right: calc(50% - 660px);
            top: 16px;
        }

        .conheca-btn:hover {
            transform: scale(1.05);
        }

        .designer-btn {
            max-width: 470px;
            height: auto;
            cursor: pointer;
            transition: transform 0.2s ease;
            position: absolute;
            right: calc(50% - 660px);
            top: 203px;
        }

        .designer-btn:hover {
            transform: scale(1.05);
        }

        @media screen and (max-width: 768px) {
            body {
                background-image: url('png/botao-contatocelular.png');
                background-attachment: fixed;
                background-size: cover;
                min-height: 100vh;
                overflow-y: auto;
            }

            .header {
                padding-top: 10px;
                position: relative;
            }

            .logo {
                max-width: 68px;
                margin-top: 27px;
            }

            .contato-btn {
                max-width: 100px;
                position: absolute;
                left: calc(50% - 150px);
                top: 32px;
            }

            .sites-btn {
                max-width: 100px;
                position: absolute;
                left: calc(50% - 150px);
                top: 80px;
            }

            .conheca-btn {
                max-width: 100px;
                position: absolute;
                right: calc(50% - 150px);
                top: 32px;
            }

            .designer-btn {
                max-width: 100px;
                position: absolute;
                right: calc(50% - 150px);
                top: 80px;
            }

            .contato-btn:hover,
            .sites-btn:hover,
            .conheca-btn:hover,
            .designer-btn:hover {
                transform: scale(1.02);
            }
        }

        .papiro-mobile {
            display: none;
            width: 100%;
            max-width: 500px;
            height: auto;
            margin: 0 auto;
            padding: 20px 0;
            min-height: calc(100vh - 200px); /* Ajusta a altura mínima considerando o header */
        }

        .papiro-desktop {
            display: block;
            width: 100%;
            max-width: 1920px;
            height: auto;
            margin: 0 auto;
            padding: 20px 0;
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 200px);
        }

        @media screen and (max-width: 768px) {
            body {
                background-image: url('png/botao-contatocelular.png');
            }

            .header {
                padding-top: 10px;
                position: relative;
            }

            .logo {
                max-width: 68px;
                margin-top: 27px;
            }

            .contato-btn {
                max-width: 100px;
                position: absolute;
                left: calc(50% - 150px);
                top: 32px;
            }

            .sites-btn {
                max-width: 100px;
                position: absolute;
                left: calc(50% - 150px);
                top: 80px;
            }

            .conheca-btn {
                max-width: 100px;
                position: absolute;
                right: calc(50% - 150px);
                top: 32px;
            }

            .designer-btn {
                max-width: 100px;
                position: absolute;
                right: calc(50% - 150px);
                top: 80px;
            }

            .contato-btn:hover,
            .sites-btn:hover,
            .conheca-btn:hover,
            .designer-btn:hover {
                transform: scale(1.02);
            }

            .papiro-mobile {
                display: block;
                position: relative;
                z-index: 1;
                margin-bottom: 0;
                padding-bottom: 0;
            }
            .papiro-desktop {
                display: none;
                position: relative;
                z-index: 1;
                margin-bottom: 0;
                padding-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="contato.html">
            <img src="png/botao-contato.png" alt="Botão Contato" class="contato-btn">
        </a>
        <a href="sites.html">
            <img src="png/botao-sites.png" alt="Botão Sites" class="sites-btn">
        </a>
        <a href="conheca.html">
            <img src="png/botao-conheca.png" alt="Botão Conheça" class="conheca-btn">
        </a>
        <a href="designer.html">
            <img src="png/botao-designer.png" alt="Botão Designer" class="designer-btn">
        </a>
        <a href="index.html" class="logo-link">
            <img src="png/logo.png" alt="Logo" class="logo">
        </a>
    </div>
    <img src="png/papiroMobile.png" alt="Papiro Mobile" class="papiro-mobile">
    <img src="png/papiroDesktop.png" alt="Papiro Desktop" class="papiro-desktop">
</body>
</html>
